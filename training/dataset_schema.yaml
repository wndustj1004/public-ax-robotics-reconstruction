# =============================================================================
#  데이터셋 스키마 — 폴더 구조와 클래스 정의만 담는다.
# =============================================================================
#  ※ 이 저장소에는 이미지도 라벨도 들어 있지 않다.
#     프로젝트 당시의 데이터셋(약 1,000프레임)은 보존되어 있지 않고,
#     부트캠프 실습 이미지는 공개·재사용 허가를 확인할 수 없어 넣지 않았다.
#     아래는 같은 구조를 다시 만들 때 쓰는 틀이다.
# =============================================================================

# ultralytics 가 읽는 형식 그대로다. 경로는 이 파일 기준 상대경로.
path: ./dataset
train: images/train
val: images/val
test: images/test

nc: 3
names:
  0: normal
  1: robotfix
  2: humanfix

# --- 이 데이터셋을 만들 때의 규칙 ---------------------------------------------
# 아래 항목은 학습 코드가 읽지 않는다. 사람이 읽는 메모다.
_collection_rules:
  대상: >-
    실물 배양 플레이트를 쓸 수 없는 환경이므로, 조치 등급별 표준 이미지를 인쇄해
    플레이트 모형에 부착한 것을 판별 대상으로 삼는다. 색 자체가 품질 판정 기준이
    아니라, 서로 다른 조치가 필요한 공정 상태를 나타내는 대리 라벨이다.
  촬영_시점: >-
    카메라가 고정 삼각대가 아니라 주행 중인 차체에 달려 있다. 그래서 거리와 각도를
    바꿔 가며 촬영한다. 정면 정지 사진만 모으면 실제 주행 시점과 분포가 달라진다.
  분할: train / val 은 같은 촬영 세션이 양쪽에 섞이지 않게 나눈다.
  주의: >-
    단일 조명·단일 배경에서만 촬영하면 조명·배경 변화에 대한 일반화를 검증할 수
    없다. 그 경우 정확도를 수치로 주장해서는 안 된다.

_expected_layout: |
  dataset/
  ├─ images/
  │  ├─ train/   *.jpg
  │  ├─ val/     *.jpg
  │  └─ test/    *.jpg
  └─ labels/
     ├─ train/   *.txt   (YOLO 형식: class cx cy w h, 값은 0~1 정규화)
     ├─ val/     *.txt
     └─ test/    *.txt
